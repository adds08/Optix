<!--
  The Optix short mark on its navy plate, for square slots that need the
  brand colours baked in (favicon, app icon, an email header).
  Colours are literal here on purpose: a plate that themed with its
  surroundings defeats the reason the plate exists.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Optix">
  <rect width="96" height="96" rx="18" fill="#082F49"/>
  <g transform="translate(20.16 19.44) scale(0.4821)" fill="none"
     stroke="#FFCA00" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="57.75" cy="59.25" rx="53" ry="54.5"/>
  </g>
</svg>
