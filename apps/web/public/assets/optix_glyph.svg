<!--
  The Optix short mark: the wordmark's own "O".
  Geometry measured from logo.png and kept in step with
  apps/web/components/optix-mark.tsx (O_ELLIPSE + WORDMARK_STROKE).
  currentColor so one file serves navy on paper and yellow on dark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115.5 118.5" fill="none"
     stroke="currentColor" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="Optix">
  <ellipse cx="57.75" cy="59.25" rx="53" ry="54.5"/>
</svg>
