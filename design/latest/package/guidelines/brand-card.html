<!-- @dsCard group="Brand" viewport="700x140" name="Card Anatomy" subtitle="Header + metrics bar + collapsible content" -->
<link rel="stylesheet" href="../styles.css">
<div style="margin:8px; background:var(--surface-0);">
  <div style="display:flex; background:var(--surface-3); border:1px solid var(--border-1); border-radius:var(--radius-md); overflow:hidden;">
    <div style="width:3px; flex:none; background:var(--accent);"></div>
    <div style="flex:1; min-width:0;">
      <div style="display:flex; align-items:center; gap:11px; padding:12px 20px;">
        <span style="font-family:var(--font-sans); font-size:16.5px; font-weight:650; color:var(--text-heading); letter-spacing:-0.015em;">Legacy West Utilities</span>
        <span style="font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); border:1px solid var(--border-3); border-radius:3px; padding:2px 7px;">JOB 22018</span>
        <div style="flex:1;"></div>
        <span style="font-size:12px; color:var(--text-muted);">2 crews · 47 tools</span>
      </div>
      <div style="display:flex; border-top:1px solid var(--border-0); background:var(--surface-2);">
        <div style="flex:1; padding:9px 20px; border-right:1px solid var(--border-0); display:flex; align-items:center; justify-content:space-between;">
          <span style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; color:var(--text-muted);">TOOLS OUT</span>
          <span style="font-size:15px; font-weight:600; color:var(--text-heading);">47</span>
        </div>
        <div style="flex:1; padding:9px 20px; display:flex; align-items:center; justify-content:space-between;">
          <span style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; color:var(--text-muted);">VALUE</span>
          <span style="font-size:15px; font-weight:600; color:var(--text-heading);">$12.4k</span>
        </div>
      </div>
    </div>
  </div>
</div>
