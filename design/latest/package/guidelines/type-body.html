<!-- @dsCard group="Type" viewport="700x90" name="Body & UI Text" subtitle="12.5px base, 11-13px range for UI chrome" -->
<link rel="stylesheet" href="../styles.css">
<div style="padding:16px 24px; background:var(--surface-0); font-family:var(--font-sans); display:flex; flex-direction:column; gap:4px;">
  <div style="font-size:12.5px; color:var(--text-primary); line-height:1.55;">Body text at 12.5px — the default for UI content, row descriptions, notes. Line height 1.55 for readability in dense layouts.</div>
  <div style="display:flex; gap:16px; margin-top:4px;">
    <span style="font-size:11px; color:var(--text-muted);">11px hint / footer</span>
    <span style="font-size:11.5px; color:var(--text-secondary);">11.5px secondary</span>
    <span style="font-size:12px; color:var(--text-secondary);">12px data cell</span>
    <span style="font-size:13px; color:var(--text-primary);">13px table content</span>
  </div>
</div>
