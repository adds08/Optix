<!-- @dsCard group="Brand" viewport="700x80" name="Interaction States" subtitle="Hover = surface-5, active chip = surface-8, focus = accent-bg" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:10px; padding:16px 20px; background:var(--surface-0); font-family:var(--font-sans); font-size:12px;">
  <div style="display:flex; align-items:center; padding:6px 13px; border-radius:var(--radius-sm); background:var(--surface-4); border:1px solid var(--border-2); color:var(--text-muted);">Default</div>
  <div style="display:flex; align-items:center; padding:6px 13px; border-radius:var(--radius-sm); background:var(--surface-5); border:1px solid var(--border-2); color:var(--text-secondary);">Hover</div>
  <div style="display:flex; align-items:center; padding:6px 13px; border-radius:var(--radius-sm); background:var(--surface-8); border:1px solid var(--border-2); color:var(--text-heading); font-weight:600;">Active</div>
  <div style="display:flex; align-items:center; padding:6px 13px; border-radius:var(--radius-sm); background:var(--accent-bg); border:1px solid var(--accent); color:var(--accent-fg); font-weight:600;">Selected</div>
  <div style="display:flex; align-items:center; padding:6px 13px; border-radius:var(--radius-sm); background:var(--accent); color:var(--surface-0); font-weight:650;">Primary</div>
</div>
