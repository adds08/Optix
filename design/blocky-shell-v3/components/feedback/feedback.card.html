<!-- @dsCard group="Components" viewport="700x120" name="Badge & StatusPill" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root"></div>
<script>
window.__ds = function(names) {
  var out = {}, miss = [];
  var pools = [];
  // Prefer an explicit namespace if the bundle set one
  for (var k in window) {
    try {
      var v = window[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && k[0] === k[0].toUpperCase() && k.length > 2) {
        for (var i = 0; i < names.length; i++) if (typeof v[names[i]] === 'function') { pools.push(v); break; }
      }
    } catch (e) {}
  }
  pools.push(window);
  names.forEach(function(n) {
    for (var p = 0; p < pools.length; p++) {
      if (typeof pools[p][n] === 'function') { out[n] = pools[p][n]; return; }
    }
    miss.push(n);
  });
  if (miss.length) {
    document.getElementById('root').innerHTML =
      '<div style="padding:16px;background:var(--surface-3);border:1px solid var(--warn-border);' +
      'border-radius:4px;color:var(--warn);font-family:var(--font-mono);font-size:11px;">' +
      'Bundle not built yet — missing: ' + miss.join(', ') + '</div>';
    return null;
  }
  return out;
};
</script>
<script type="text/babel">
const __c = window.__ds(['Badge', 'StatusPill']);
if (__c) {
const { Badge, StatusPill } = __c;
function Demo() {
  return <div style={{padding:16, background:'var(--surface-0)', display:'flex', flexDirection:'column', gap:10}}>
    <div style={{display:'flex', gap:8, alignItems:'center'}}>
      <Badge>JOB 22018</Badge>
      <Badge variant="accent">28 tools</Badge>
      <Badge variant="ok">Good</Badge>
      <Badge variant="warn">Fair</Badge>
      <Badge variant="crit">OVERDUE</Badge>
    </div>
    <div style={{display:'flex', gap:8, alignItems:'center'}}>
      <StatusPill variant="crit" dot>1 stopping work</StatusPill>
      <StatusPill variant="warn">⚠ 2 crews need vehicles</StatusPill>
      <StatusPill variant="ok" dot>Fully rigged</StatusPill>
      <StatusPill variant="accent" dot>Ordered</StatusPill>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
}
</script>
