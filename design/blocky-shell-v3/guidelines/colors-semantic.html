<!-- @dsCard group="Colors" viewport="700x120" name="Semantic Status" subtitle="OK / Warn / Crit — reserved for meaning, never decorative" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:8px; padding:16px; background:var(--surface-0); font-family:var(--font-mono); font-size:11px;">
  <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="width:100%; height:52px; border-radius:var(--radius-md); background:var(--ok);"></div>
    <span style="color:var(--ok);">--ok</span><span style="color:var(--text-muted); font-size:10px;">#4FA97A</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="width:100%; height:52px; border-radius:var(--radius-md); background:var(--warn);"></div>
    <span style="color:var(--warn);">--warn</span><span style="color:var(--text-muted); font-size:10px;">#E4A13B</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="width:100%; height:52px; border-radius:var(--radius-md); background:var(--crit);"></div>
    <span style="color:var(--crit);">--crit</span><span style="color:var(--text-muted); font-size:10px;">#D2694A</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="width:100%; height:52px; border-radius:var(--radius-md); background:var(--purple);"></div>
    <span style="color:var(--purple);">--purple</span><span style="color:var(--text-muted); font-size:10px;">#B89AE0</span>
  </div>
</div>
