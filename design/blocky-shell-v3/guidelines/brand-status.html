<!-- @dsCard group="Brand" viewport="700x90" name="Status Indicators" subtitle="Tick dots, edge bars, and status pills" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:14px; padding:16px 20px; background:var(--surface-0); font-family:var(--font-sans); font-size:11.5px; align-items:center;">
  <div style="display:flex; align-items:center; gap:6px;">
    <div style="width:3px; height:20px; border-radius:2px; background:var(--ok);"></div>
    <span style="color:var(--text-secondary);">Rigged</span>
  </div>
  <div style="display:flex; align-items:center; gap:6px;">
    <div style="width:3px; height:20px; border-radius:2px; background:var(--warn);"></div>
    <span style="color:var(--text-secondary);">Needs vehicle</span>
  </div>
  <div style="display:flex; align-items:center; gap:8px; background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn); border-radius:3px; padding:4px 10px; font-weight:600;">
    ⚠ 2 crews need vehicles
  </div>
  <div style="display:flex; align-items:center; gap:8px; background:var(--crit-bg); border:1px solid var(--crit-border); color:var(--crit); border-radius:4px; padding:3px 9px; font-weight:650;">
    1 stopping work
  </div>
  <div style="display:flex; gap:4px;">
    <span style="width:7px; height:7px; border-radius:2px; background:var(--ok);"></span>
    <span style="width:7px; height:7px; border-radius:2px; background:var(--warn);"></span>
    <span style="width:7px; height:7px; border-radius:2px; background:var(--crit);"></span>
    <span style="width:7px; height:7px; border-radius:2px; background:var(--accent);"></span>
  </div>
</div>
