<!-- @dsCard group="Spacing" viewport="700x100" name="Edge Accents" subtitle="3px colored left bar — status indicator on cards" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:12px; padding:16px 20px; background:var(--surface-0); font-family:var(--font-sans);">
  <div style="display:flex; overflow:hidden; border-radius:var(--radius-md); border:1px solid var(--border-1); flex:1;">
    <div style="width:3px; flex:none; background:var(--accent);"></div>
    <div style="padding:10px 14px; background:var(--surface-3);"><span style="font-size:12px; color:var(--text-primary);">Accent edge</span></div>
  </div>
  <div style="display:flex; overflow:hidden; border-radius:var(--radius-md); border:1px solid var(--border-1); flex:1;">
    <div style="width:3px; flex:none; background:var(--ok);"></div>
    <div style="padding:10px 14px; background:var(--surface-3);"><span style="font-size:12px; color:var(--text-primary);">OK edge</span></div>
  </div>
  <div style="display:flex; overflow:hidden; border-radius:var(--radius-md); border:1px solid var(--border-1); flex:1;">
    <div style="width:3px; flex:none; background:var(--warn);"></div>
    <div style="padding:10px 14px; background:var(--surface-3);"><span style="font-size:12px; color:var(--text-primary);">Warn edge</span></div>
  </div>
  <div style="display:flex; overflow:hidden; border-radius:var(--radius-md); border:1px solid var(--border-1); flex:1;">
    <div style="width:3px; flex:none; background:var(--crit);"></div>
    <div style="padding:10px 14px; background:var(--surface-3);"><span style="font-size:12px; color:var(--text-primary);">Crit edge</span></div>
  </div>
</div>
