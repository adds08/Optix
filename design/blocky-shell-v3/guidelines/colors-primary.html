<!-- @dsCard group="Colors" viewport="700x120" name="Primary Accent" subtitle="Blue accent scale — links, active states, focus rings" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:8px; padding:16px; background:var(--surface-0); font-family:var(--font-mono); font-size:11px;">
  <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="width:100%; height:52px; border-radius:var(--radius-md); background:var(--accent-dim);"></div>
    <span style="color:var(--text-muted);">--accent-dim</span><span style="color:var(--text-muted); font-size:10px;">#3A6E9E</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="width:100%; height:52px; border-radius:var(--radius-md); background:var(--accent);"></div>
    <span style="color:var(--text-primary);">--accent</span><span style="color:var(--text-muted); font-size:10px;">#7FB0E4</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="width:100%; height:52px; border-radius:var(--radius-md); background:var(--accent-bright);"></div>
    <span style="color:var(--text-primary);">--accent-bright</span><span style="color:var(--text-muted); font-size:10px;">#A9CDF2</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="width:100%; height:52px; border-radius:var(--radius-md); background:var(--accent-bg); border:1px solid var(--border-2);"></div>
    <span style="color:var(--text-muted);">--accent-bg</span><span style="color:var(--text-muted); font-size:10px;">#162233</span>
  </div>
</div>
