<!-- @dsCard group="Brand" viewport="700x120" name="Data Row Patterns" subtitle="Alternating row backgrounds with inline status" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--surface-0); font-family:var(--font-sans); border:1px solid var(--border-1); border-radius:var(--radius-md); overflow:hidden; margin:8px;">
  <div style="display:flex; align-items:center; gap:14px; padding:8px 20px; background:var(--surface-2); border-bottom:1px solid var(--border-0);">
    <span style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; color:var(--text-muted); width:88px;">TAG</span>
    <span style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; color:var(--text-muted); flex:1;">TOOL</span>
    <span style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; color:var(--text-muted); width:104px; text-align:right;">CONDITION</span>
  </div>
  <div style="display:flex; align-items:center; gap:14px; padding:8px 20px; background:var(--row-base);">
    <span style="font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--accent); width:88px;">ST-00412</span>
    <span style="font-size:13px; color:var(--text-primary); flex:1;">Wacker WP1550 Plate Compactor</span>
    <span style="font-size:12px; font-weight:600; color:var(--ok); width:104px; text-align:right;">Good</span>
  </div>
  <div style="display:flex; align-items:center; gap:14px; padding:8px 20px; background:var(--row-alt);">
    <span style="font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--accent); width:88px;">ST-00298</span>
    <span style="font-size:13px; color:var(--text-primary); flex:1;">Multiquip 2in Trash Pump</span>
    <span style="font-size:12px; font-weight:600; color:var(--warn); width:104px; text-align:right;">Fair</span>
  </div>
</div>
