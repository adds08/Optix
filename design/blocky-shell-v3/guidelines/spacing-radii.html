<!-- @dsCard group="Spacing" viewport="700x100" name="Border Radii" subtitle="3px blocky default — never rounded or pill-shaped" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:16px; padding:18px 24px; background:var(--surface-0); font-family:var(--font-mono); font-size:10px; align-items:center;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:56px; height:40px; border-radius:var(--radius-sm); background:var(--surface-4); border:1px solid var(--border-2);"></div>
    <span style="color:var(--text-muted);">3px sm</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:56px; height:40px; border-radius:var(--radius-md); background:var(--surface-4); border:1px solid var(--border-2);"></div>
    <span style="color:var(--text-muted);">4px md</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:56px; height:40px; border-radius:var(--radius-lg); background:var(--surface-4); border:1px solid var(--border-2);"></div>
    <span style="color:var(--text-muted);">6px lg</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:4px; padding-left:16px; border-left:1px solid var(--border-0);">
    <span style="color:var(--text-secondary); font-family:var(--font-sans); font-size:12px;">Blocky by design — 3-4px is the default. No pill shapes, no large rounds. The only exception is avatar circles.</span>
  </div>
</div>
