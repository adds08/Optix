# STInventory — local dev compose. Brings up Postgres + API + Web.
# `make ENV=local up` then `make seed`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: stinventory-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stinventory}
      POSTGRES_DB: ${POSTGRES_DB:-stinventory}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stinventory"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A real SMTP server with a web inbox, for LOCAL development only.
  #
  # `sendMail`'s console fallback already stops an unconfigured stack from
  # losing mail, but a line in a log is not a link anybody can click — and the
  # invite -> signup -> onboarding loop is only testable end to end if the
  # invite arrives somewhere you can open it. Mailpit accepts on 1025 and
  # serves the mailbox at http://localhost:8025.
  #
  # It delivers NOWHERE. Everything it accepts stays in memory in this
  # container, which is exactly what makes it safe to point real-looking
  # addresses at while testing. Never add this to a deployed environment.
  mailpit:
    image: axllent/mailpit:latest
    container_name: stinventory-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: stinventory-dev:latest
    container_name: stinventory-api
    working_dir: /workspace/apps/api
    command: >
      sh -c "
        echo '[api] waiting for postgres' &&
        until pg_isready -h postgres -U postgres -d stinventory -t 1 >/dev/null 2>&1; do sleep 1; done &&
        echo '[api] applying migrations' &&
        cd /workspace/packages/db && pnpm migrate &&
        cd /workspace/apps/api && pnpm dev
      "
    environment:
      NODE_ENV: development
      PORT: 4100
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-stinventory}@postgres:5432/${POSTGRES_DB:-stinventory}
      SESSION_SECRET: ${SESSION_SECRET:-stinventory-dev-secret-please-change-to-32-chars-minimum}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # BambooHR, read-only. NOT passed to the `web` service — the key is
      # server-side and a NEXT_PUBLIC_* style leak would put it in a bundle.
      #
      # This block is why "it's already in .env.local" is not enough: compose
      # names every variable it forwards, and `--env-file` only feeds the
      # `${...}` substitution HERE. A key present on disk and absent from this
      # list reaches the container as an empty string, and `serverEnv()` then
      # reports the sync as unconfigured with the file sitting right there.
      # Empty disables the sync, which is the correct default.
      BAMBOOHR_COMPANY_DOMAIN: ${BAMBOOHR_COMPANY_DOMAIN:-}
      BAMBOOHR_API_KEY: ${BAMBOOHR_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-15000}
    ports:
      - "${API_PORT:-4100}:4100"
    volumes:
      - ./apps:/workspace/apps
      - ./packages:/workspace/packages
      - ./package.json:/workspace/package.json
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml
      - ./.npmrc:/workspace/.npmrc
      - ./tsconfig.base.json:/workspace/tsconfig.base.json
      - ./turbo.json:/workspace/turbo.json
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/db/node_modules
      - /workspace/packages/api-contracts/node_modules
      - /workspace/packages/auth/node_modules
      - /workspace/packages/env/node_modules
      - /workspace/packages/logger/node_modules
      - /workspace/packages/mail/node_modules
      - /workspace/packages/types/node_modules
      - /workspace/packages/config-eslint/node_modules
      - /workspace/packages/config-tsconfig/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: stinventory-dev:latest
    container_name: stinventory-web
    working_dir: /workspace/apps/web
    command: sh -c "pnpm dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4100}
      # Local only: pre-fills the form and shows the demo account list.
      #
      # Those thirteen accounts exist ONLY in the demo fixture (`make seed-demo`).
      # After `make seed-urban` the database holds Urban's real register and two
      # administrators, so every button in that panel names an address that is not
      # there and fails on click. Set this to 0 alongside the real dataset — or
      # leave it unset in .env.local, which is what the default below is for.
      NEXT_PUBLIC_SHOW_DEMO_LOGINS: ${NEXT_PUBLIC_SHOW_DEMO_LOGINS:-1}
    ports:
      - "${WEB_PORT:-3100}:3100"
    volumes:
      - ./apps:/workspace/apps
      - ./packages:/workspace/packages
      - ./package.json:/workspace/package.json
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml
      - ./.npmrc:/workspace/.npmrc
      - ./tsconfig.base.json:/workspace/tsconfig.base.json
      - ./turbo.json:/workspace/turbo.json
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/db/node_modules
      - /workspace/packages/api-contracts/node_modules
      - /workspace/packages/auth/node_modules
      - /workspace/packages/env/node_modules
      - /workspace/packages/logger/node_modules
      - /workspace/packages/types/node_modules
      - /workspace/packages/config-eslint/node_modules
      - /workspace/packages/config-tsconfig/node_modules
    depends_on:
      api:
        condition: service_started


volumes:
  postgres_data:
