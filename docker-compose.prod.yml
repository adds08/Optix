# Production compose.
#
# Differences from docker-compose.yml that matter: real builds instead of
# `pnpm dev`, no source mounts, restart policies, and healthchecks with
# dependency gating.
#
# Postgres is not here. Both environments (dev and prod) run it on a
# dedicated droplet of its own — optix-{dev,prod}-db-01 — reachable only over
# that environment's VPC private IP, never from this box's compose network.
# DATABASE_URL in .env.production points at it directly. See DEPLOY.md.

services:
  # TLS terminator and the only thing bound to the host's network. Everything
  # else talks over the compose network, so Postgres is not reachable from the
  # internet at all.
  caddy:
    image: caddy:2-alpine
    container_name: stinventory-caddy
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST to the public hostname, e.g. tools.example.com}
      # Caddy prefixes /media/* with this so the database can store a bare key.
      S3_BUCKET: ${S3_BUCKET:-stinventory}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Static export of the Expo app (apps/mobile). Built with
      # `expo export --platform web` and copied here — no container needed,
      # Caddy serves the files directly.
      - ./field:/srv/field:ro
      # Certificates and the ACME account key. Losing these means re-issuing on
      # every restart, which Let's Encrypt rate-limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - minio

  # The Python parser service was removed. It had drifted into a second,
  # unreachable copy of the intent logic: the API never called it (it talks to
  # the model directly, now via @stinventory/intent), so it sat holding ~150MB
  # on a 1GB droplet while carrying its own stale list of valid intents. Two
  # places to add a custom intent, one of which did nothing.

  # Tool photos. Spoken to over the S3 API, so this container is an
  # implementation detail — pointing S3_* at Spaces or R2 instead needs no code
  # change and no rebuild. Kept here first because a foreman photographing a
  # tool should not wait on somebody buying a bucket.
  minio:
    image: minio/minio:latest
    container_name: stinventory-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY to 8+ chars}
      # Objects are served through Caddy on the app's own origin, so a photo is
      # same-origin to the browser and needs no CORS or second certificate.
      MINIO_BROWSER_REDIRECT_URL: ${WEB_ORIGIN}/media
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Creates the bucket and makes it publicly readable, once, then exits.
  # Photos are not secret — they are pictures of drills — and signing every
  # thumbnail in a register of 400 tools would cost more than it protects.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 2; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET;
      echo 'bucket ready';
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-stinventory}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: stinventory-api:latest
    container_name: stinventory-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      # Always the DB droplet's private IP — see DEPLOY.md. No local fallback:
      # a missing value should fail loudly, not silently try a compose-network
      # hostname that no longer exists.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the environment's DB droplet}
      # No default. A guessable session secret in production is the same as no
      # authentication at all, so the stack refuses to start without one.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to 32+ random chars}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      MOBILE_ORIGIN: ${MOBILE_ORIGIN:-}
      # Fallback only. The model a tenant actually uses is configured on the
      # settings page and stored encrypted in tenant_settings; these are here
      # so a local stack works before anyone has visited that page.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://inference.do-ai.run/v1}
      LLM_MODEL: ${LLM_MODEL:-openai-gpt-5-nano}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-15000}
      # Photo storage. Internal endpoint for writing, public base for reading.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-stinventory}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-${WEB_ORIGIN}/media}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    expose:
      - "4100"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Inlined into the client bundle at build time, so this is the public
        # URL a browser will use — not the compose-internal hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to the public API URL}
        # Pre-fills the login form and lists the demo accounts. Defaults off:
        # on a reachable host it publishes valid addresses and their shared
        # password. Set to 1 deliberately while this is a demo deployment.
        NEXT_PUBLIC_SHOW_DEMO_LOGINS: ${NEXT_PUBLIC_SHOW_DEMO_LOGINS:-0}
    image: stinventory-web:latest
    container_name: stinventory-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      # Next.js standalone binds to $HOSTNAME, and Docker sets that to the
      # container id — so the server listened only on the container's own
      # address and the image's healthcheck, which probes 127.0.0.1, could
      # never connect. Caddy reaches it as web:3100 either way, so this showed
      # up as a permanently unhealthy container in front of a working site.
      HOSTNAME: 0.0.0.0
    expose:
      - "3100"
    depends_on:
      api:
        condition: service_healthy

volumes:
  minio_data:
  caddy_data:
  caddy_config:
