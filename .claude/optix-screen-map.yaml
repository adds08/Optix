/org-chart:
  id: org-chart
  label: Org Chart
  group: Organization
  layout: desk
  permission: project.team.read
  file: apps/web/app/(app)/org-chart/page.tsx
  purpose: >
    Who reports to whom — a THIRD screen over project_team_member (the same
    rows Tools by Jobsite and People write), with reports_to_employee_id as
    its only edge.
  features:
    - Search that auto-centres the first match, with prev/next cycling and a
      match counter
    - Jobsite and role filters (SearchSelect, never a native <select>)
    - Three tabs — Chart / By Jobsite / No reporting line
    - "Chart canvas: drag-only pan, button-only zoom, no wheel handling at all (matched deliberately against the timesheet product's own jQuery-orgchart chart)"
    - Reports-to picker inline on the By Jobsite tab (EntityPicker, writes
      via the narrow setReportsTo mutation)
    - Also on N other jobs chip for a person on several projects, jumping between their instances
  key_procedures:
    - projectTeam.orgChart
    - projectTeam.setReportsTo
    - projectTeam.assign
  navigation: Organization group in the desk sidebar, or /org-chart directly.
  known_gaps:
    - "Server-side visibility: a superintendent sees their own chain and
       crew only, never a sibling superintendent's, even though both are on
       the same job — projectTeam.orgChart, not client-side filtering."
    - "As of 2026-09-03, reporting-line data in the seed exists only where
       teamRoleSpecs/teamSpecs wired it (Lone Star and DART in the demo
       fixture) — other jobs' foremen render as their own roots until wired
       or set from this screen."
    - "Delegated assignment (assign anyone who will report to you) is
       designed, not built — the flat project.team.assign permission is
       what actually gates a tenant-added tier today."
  sources:
    - docs/changelogs/2026-09-02-org-chart.md
    - docs/changelogs/2026-09-03-team-role-register.md
    - docs/changelogs/2026-09-03-header-dedup-and-map-skills.md
