/chat:
  id: handoff
  label: Hand Off
  group: Field
  layout: field
  permission: null
  file: apps/web/app/(app)/chat/page.tsx
  purpose: >
    Natural-language capture for custody actions — say what happened, the
    worker parses it, and it either applies through the custody chokepoint or
    parks for a human. Field nav calls it "Hand Off"; the route is /chat.
  features:
    - Two-pane layout — channel list + thread
    - Composer with @mentions (MentionInput, MentionChips), Send button
    - Message list, polling faster while a message is queued/processing
    - Per-message Confirm button executing the proposed action, inline
      ErrorNote on failure
    - Status pills per message (queued/processing/etc.)
  key_procedures:
    - messaging.listChannels
    - messaging.messages
    - messaging.send
    - messaging.confirmAction
  navigation: Field group in the field sidebar (label "Hand Off"), or /chat directly.
  known_gaps:
    - "Everything chat can do, a screen can also do — it is a faster path to
       the same procedures, never a second implementation (05-features.md)."
  sources:
    - docs/architecture/05-features.md

