/jobsites:
  id: tools-by-jobsite
  label: Tools by Jobsite
  group: Operations
  layout: desk
  permission: asset.read
  file: apps/web/app/(app)/jobsites/page.tsx
  purpose: >
    The flagship operational screen — jobs, crews, rigs and loose tools in
    one place, arranged by job instead of by tool. The same custody facts as
    /custody, writing through the same chokepoint, so the two screens cannot
    disagree.
  features:
    - Global search across job/foreman/truck/trailer/serial/tool
    - FilterSheet (job, foreman, tool status/category, rig-gap) with
      removable filter pills
    - Jobs/Pool and List/Cards view toggles; sort dropdown; master
      expand/collapse stepper
    - 'Per-job card: dashed "add a foreman and truck/trailer", per-job ellipsis menu'
    - "Crew cards: truck/trailer slots opening a RigPicker dialog, foreman ellipsis menu, CrewAssignDialog for assigning foreman/tools"
    - "JobsiteTeamStrip: add/remove PM and superintendent (roster-only, no custody move -- see known_gaps)"
    - JobsiteToolTable (sortable, "show all" toggle) and JobsiteActivity
      (per-job live feed, hideable)
  key_procedures:
    - employee.list
    - asset.list
    - project.list
    - vehicle.list
    - projectTeam.all
    - location.setCustodian
    - vehicle.update
    - projectTeam.assign / remove
  navigation: Operations group in the desk sidebar, or /jobsites directly.
  known_gaps:
    - "The team strip here has NO reportsTo picker as of this evaluation —
       set who a PM/superintendent answers to from /org-chart's By Jobsite
       tab instead (docs/changelogs/2026-09-03-org-chart.md)."
    - "PM/superintendent assignment through this strip is a PURE ROSTER
       ENTRY — no tools follow, no primary project changes. Only a
       foreman's link here moves custody."
    - "This screen and /people write the SAME project_team_member table
       through the same moveEmployeeToProject function — not two stores to
       keep in sync, one table with two writers by design
       (memory:crew-data-is-central-screens-are-views)."
  sources:
    - docs/changelogs/2026-09-02-org-chart.md
    - memory:crew-data-is-central-screens-are-views

