name: CI

# Every push and every PR. The point is that nothing reaches main without the
# custody tests passing — four separate writers of the custody invariant were
# fixed by hand recently with nothing to catch the next regression.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push makes an in-flight run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    # STI-1102. This job used to run `pnpm test` with no database, and every
    # DB-backed suite guards itself with `describe.skipIf(!process.env.DATABASE_URL)`
    # — so 178 of 245 tests silently skipped and the job went green. Custody,
    # tenant-scoped login, ledger append-only, project scope and the RBAC matrix
    # were among them: precisely the suites this workflow's header says nothing
    # reaches main without.
    #
    # The service below is the same Postgres the `smoke` job already uses. The
    # guard test in packages/api-contracts/src/db-suites-run.test.ts is what
    # stops this regressing quietly if the env var is ever dropped again — the
    # skip is invisible by design, so something has to assert on it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stinventory_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stinventory_ci
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Most suites create their own throwaway tenants and need only the schema.
      # Same command the smoke job runs, against a fresh database.
      - name: Migrate
        run: pnpm db:migrate

      # But not all of them, and the exception is deliberate: `rbac-matrix.test.ts`
      # reads the SEEDED `urban` tenant on purpose, because a permission matrix
      # asserted against the test's own fixtures only proves the fixtures are
      # self-consistent — it has to be the database people actually log into.
      #
      # That suite had never once run in CI. Every DB-backed suite guards itself
      # with `describe.skipIf(!process.env.DATABASE_URL)`, so before b367c1f
      # (STI-1102) they all skipped silently and the job went green. b367c1f gave
      # CI a database and a Migrate step but no seed, so the first run in which
      # this suite executed was also the first in which it failed:
      # `tenantId = t!.id` on a tenant that was never created, which surfaces as
      # `TypeError: Cannot read properties of undefined (reading 'id')` and reads
      # like a broken test rather than a missing fixture.
      #
      # `deploy` needs `check`, so that failure stopped shipping outright:
      # production sat four commits behind main for a day, without the invite
      # migrations, while main looked merged and fine.
      #
      # Idempotent (skips when the tenant exists), and it refuses to touch a
      # production database without SEED_ALLOW_PRODUCTION.
      - name: Seed
        run: pnpm db:seed

      - name: Test
        run: pnpm test

      # Lint blocks as of 2026-08-09. It was `continue-on-error` because it used
      # to fail on pre-existing `any` usage in apps/api; it no longer does —
      # `pnpm lint` exits 0, with 9 warnings and no errors. Warnings stay
      # non-blocking deliberately (no `--max-warnings`), so this catches new
      # errors without turning the existing backlog into a merge gate.
      - name: Lint
        run: pnpm lint

  build:
    name: production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the real images. This is what catches the class of failure that
      # went unnoticed for the whole project so far: the API compiled fine and
      # could not actually run, because workspace packages export raw
      # TypeScript. A build that is never executed proves nothing.
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t stinventory-api:ci .

      - name: Build web image
        run: docker build -f docker/Dockerfile.web -t stinventory-web:ci .

  smoke:
    name: migrate + boot against a real postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stinventory_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stinventory_ci
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      WEB_ORIGIN: http://localhost:3100
      PORT: 4100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `db:migrate` below only proves the committed SQL *applies* — it never
      # compares the result against schema.ts, so an edited schema with no
      # generated migration used to sail through green. This step closes that
      # gap. drizzle-kit 0.28.1 has no --check flag and its exit code is no
      # signal (verified against the pinned binary): add-column drift emits a
      # migration and exits 0, and rename-shaped drift prints an interactive
      # "created or renamed?" prompt and — with stdin closed — exits 0 having
      # emitted NOTHING, so a dirty-tree test alone stays green on real drift.
      # The only output a drift-free run produces is the "No schema changes"
      # line, so the step requires that sentinel and additionally fails if
      # generate left any new or modified file behind. stdin from /dev/null
      # makes the prompt path exit immediately instead of waiting for input.
      # Hand-written migrations (0005, 0009, 0013, …) have no schema.ts
      # counterpart and never touch the snapshot, so they do not trip this.
      # (`drizzle-kit check` was evaluated and rejected: it validates
      # migration-history collisions and reports "Everything's fine" with
      # real schema drift in place.)
      - name: Check for uncommitted schema drift
        run: |
          pnpm db:generate < /dev/null 2>&1 | tee /tmp/drizzle-generate.log
          if ! grep -q "No schema changes, nothing to migrate" /tmp/drizzle-generate.log \
            || [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "::error::packages/db/src/schema has changed without a generated migration. Run 'make generate' and commit the resulting SQL and meta files."
            git status --porcelain -- packages/db/drizzle
            git diff --stat -- packages/db/drizzle
            exit 1
          fi

      # Migrations run from scratch on an empty database. This proves the
      # committed SQL applies cleanly end to end; drift between schema.ts and
      # the migration folder is caught by the generate check above, not here.
      - name: Migrate a fresh database
        run: pnpm db:migrate

      - name: Build and boot the API
        run: |
          pnpm --filter @stinventory/db build
          pnpm --filter @stinventory/api build
          node apps/api/dist/index.js &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4100/health > /dev/null; then
              echo "API is serving"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"; exit 1

  deploy:
    name: deploy to production
    # Only after the code is proven: types, tests, all three images building,
    # and the API booting against a freshly migrated database. A deploy that
    # runs regardless of the checks is just a slower way to break production.
    needs: [check, build, smoke]
    # Never on a pull request, and never from a branch.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialised: two deploys building on a 1GB droplet at once would starve it.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://urban.bodhitechlabs.com
    steps:
      - name: Open an SSH session to the droplet
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key rather than StrictHostKeyChecking=no, so a swapped
          # host fails loudly instead of being trusted silently.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        # The key is restricted server-side to running docker/deploy.sh, so the
        # command sent here is ignored — whatever is asked for, the server runs
        # the deploy. That script fetches, rebuilds, waits for /health and rolls
        # back to the previous commit if it never comes up.
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" deploy

      - name: Confirm the site is serving the new build
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://urban.bodhitechlabs.com/health || true)
            [ "$code" = "200" ] && { echo "healthy"; exit 0; }
            sleep 10
          done
          echo "site did not come back healthy"; exit 1
